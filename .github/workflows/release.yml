name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate annotated tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          [[ $tag =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ $(git cat-file -t "refs/tags/$tag") == tag ]]
          version=${tag#v}
          workspace_version=$(awk '
            /^\[workspace.package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          [[ $version == "$workspace_version" ]]
          grep -Fq "## [$version]" CHANGELOG.md
      - name: Install pinned Rust toolchain and musl target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 x86_64-unknown-linux-musl
      - name: Build static release binaries
        run: cargo +1.85.0 build --workspace --locked --release --target x86_64-unknown-linux-musl
      - name: Verify static PIE binaries
        run: bash scripts/check-static.sh
      - name: Create reproducible archives and checksums
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          bash scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
