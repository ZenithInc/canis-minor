name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Run Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo +1.85.0 test --workspace --locked
      - name: Test SSH target parser
        run: bash tests/target-parser.sh

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh deploy/*.sh tests/*.sh
          shellcheck scripts/*.sh deploy/*.sh tests/*.sh
      - name: Check dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85.0"
          command: check advisories licenses sources
          arguments: --all-features
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose .
      - name: Enforce public-tree exclusions
        run: bash scripts/check-public-tree.sh

  static:
    name: Static Linux binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and musl target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 x86_64-unknown-linux-musl
      - name: Build both static release binaries
        run: cargo +1.85.0 build --workspace --locked --release --target x86_64-unknown-linux-musl
      - name: Verify static PIE binaries
        run: bash scripts/check-static.sh

  website:
    name: Website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          package_json_file: website/package.json
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check Astro types and content
        run: pnpm check
      - name: Build static website
        run: pnpm build
      - name: Check internal links and required routes
        run: |
          pnpm check:links
          test -f dist/index.html
          test -f dist/zh-cn/index.html
          test -f dist/404.html
          test -f dist/pagefind/pagefind.js
          test -f dist/sitemap-index.xml
