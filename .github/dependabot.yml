version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    labels: [dependencies, rust]
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    labels: [dependencies, website]
    groups:
      website-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
